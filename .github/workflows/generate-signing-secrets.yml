name: Generate Signing Secrets

# Generates a fresh Android release keystore and the four signing secrets the
# release workflow consumes:
#   SIGNING_KEYSTORE_BASE64
#   SIGNING_STORE_PASSWORD
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD
#
# The values are written to a short-lived artifact (never to the logs) so they
# can be copied into Settings -> Secrets and variables -> Actions.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate keystore and signing secrets
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate release keystore and 4 secrets
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/cineflow-release.keystore"
          ALIAS="cineflow"
          # Alphanumeric password: safe for keytool, base64 and shell quoting.
          STORE_PASS="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 28)"
          KEY_PASS="$STORE_PASS"

          keytool -genkeypair -v \
            -keystore "$KS" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=CineFlow, OU=Mobile, O=CineFlow, C=IN"

          base64 -w0 "$KS" > "$RUNNER_TEMP/keystore.base64"

          {
            echo "SIGNING_KEYSTORE_BASE64=$(cat "$RUNNER_TEMP/keystore.base64")"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASS"
            echo "SIGNING_KEY_ALIAS=$ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASS"
          } > "$RUNNER_TEMP/signing-secrets.env"

          echo "Keystore generated for alias '$ALIAS' (valid 10000 days)."

      - name: Upload signing material
        uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: |
            ${{ runner.temp }}/signing-secrets.env
            ${{ runner.temp }}/cineflow-release.keystore
          retention-days: 1
          if-no-files-found: error
