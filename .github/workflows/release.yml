name: Release APK (Signed)

# Builds a signed release APK. Requires the four signing secrets produced by
# the "Generate Signing Secrets" workflow:
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
#   SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
#
# The version is bumped automatically on every run: versionCode tracks the
# workflow run number and versionName becomes 1.0.<run_number>, so every
# build is a strictly newer, installable upgrade.

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  release:
    name: Build and sign release APK
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes 'tools', which no longer
          # exists in current cmdline-tools and makes sdkmanager exit 1.
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Show version
        run: echo "Building version $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set. Run the 'Generate Signing Secrets' workflow first, then add the secrets under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "Keystore decoded."

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          echo "Verifying $APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: CineFlow-v${{ env.VERSION_NAME }}-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
